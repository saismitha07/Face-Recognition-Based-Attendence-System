<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Student | FRAMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #203a43;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        video {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            background: #111;
            display: block;
            margin: 20px auto;
        }

        canvas {
            display: none;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
        }

        .camera-btn {
            background: #203a43;
            color: white;
        }

        .capture-btn {
            background: #198754;
            color: white;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Register New Student</h1>

    <p class="subtitle">
        Enter the student's name and capture their face.
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label for="name1">Student Name</label>

            <input
                type="text"
                id="name1"
                name="name1"
                placeholder="Enter student name"
                required
            >
        </div>

        <video id="camera" autoplay playsinline></video>

        <canvas id="canvas"></canvas>

        <div>

            <button
                type="button"
                class="camera-btn"
                onclick="startCamera()">
                Start Camera
            </button>

            <button
                type="button"
                class="capture-btn"
                onclick="capturePhoto()">
                Capture Photo
            </button>

            <button
                type="button"
                class="back-btn"
                onclick="window.location.href='/'">
                Back
            </button>

        </div>

        <p id="status"></p>

    </form>

</div>

<script>

let stream = null;

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const statusText = document.getElementById("status");


async function startCamera() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: true
        });

        video.srcObject = stream;

        statusText.textContent =
            "Camera started. Position your face clearly.";

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Camera access denied or unavailable.";

    }

}


async function capturePhoto() {

    const name = document.getElementById("name1").value.trim();

    if (!name) {

        statusText.textContent =
            "Please enter the student's name first.";

        return;
    }

    if (!stream) {

        statusText.textContent =
            "Please start the camera first.";

        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.toBlob(async function(blob) {

        const formData = new FormData();

        formData.append("name1", name);

        formData.append(
            "image",
            blob,
            name + ".png"
        );

        statusText.textContent =
            "Uploading image...";

        try {

            const response = await fetch("/name", {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            if (result.success) {

                statusText.textContent =
                    result.message;

                if (stream) {

                    stream.getTracks().forEach(
                        track => track.stop()
                    );

                }

            } else {

                statusText.textContent =
                    result.message;

            }

        } catch (error) {

            console.error(error);

            statusText.textContent =
                "Something went wrong while uploading.";

        }

    }, "image/png");

}

</script>

</body>
</html>
